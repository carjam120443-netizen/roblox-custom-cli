name: Build Launcher With Linux Themes

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Validate launcher
        run: python -m py_compile launcher_gui.py

      - name: Build GUI EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RobloxCustomLauncher launcher_gui.py

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/assets/wallpapers | Out-Null
          Copy-Item dist/RobloxCustomLauncher.exe package/
          Copy-Item launcher_gui.py package/
          if (Test-Path README.md) { Copy-Item README.md package/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE package/ }
          if (Test-Path assets/wallpapers/SOURCES.md) { Copy-Item assets/wallpapers/SOURCES.md package/assets/wallpapers/ }
          @'
          RCL Theme Package

          Included desktop-inspired themes:
          - Aero
          - Windows 95
          - Classic Roblox
          - KDE Plasma
          - GNOME
          - XFCE
          - Cinnamon

          Theme selection changes the RCL launcher UI and is saved locally.
          RCL does not modify or inject into the Roblox client.
          '@ | Set-Content package/SETUP.txt

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath Roblox-Custom-Launcher-Linux-Themes.zip -Force

      - name: Upload themed launcher ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Custom-Launcher-Linux-Themes
          path: Roblox-Custom-Launcher-Linux-Themes.zip
          if-no-files-found: error
