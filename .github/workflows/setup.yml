name: Build Custom Roblox Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  setup:
    name: Build Windows GUI launcher
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Python files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.py -Recurse
          if ($files.Count -eq 0) { throw 'No Python launcher files were found.' }
          foreach ($file in $files) { python -m py_compile $file.FullName }

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build GUI EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RobloxCustomLauncher launcher_gui.py

      - name: Build CLI EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --name RobloxCustomCLI roblox_cli.py

      - name: Create setup package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/setup | Out-Null
          Copy-Item dist/RobloxCustomLauncher.exe dist/setup/
          Copy-Item dist/RobloxCustomCLI.exe dist/setup/
          if (Test-Path README.md) { Copy-Item README.md dist/setup/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/setup/ }
          @'
          Roblox Custom Launcher

          A custom branded GUI launcher inspired by the general installer/launcher UX of Fishstrap, independently implemented.

          This build uses the official Roblox website/client. It does not collect credentials or session tokens and does not inject into, patch, or bypass Roblox.
          '@ | Set-Content -Path dist/setup/SETUP.txt

      - name: Upload Windows EXEs
        uses: actions/upload-artifact@v4
        with:
          name: roblox-custom-launcher-windows
          path: dist/setup/
          if-no-files-found: error
